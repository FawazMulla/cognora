services:
  # ── Backend API (Next.js) ───────────────────────────────────────────────────
  - type: web
    name: cognora-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api run build
    startCommand: pnpm --filter @workspace/api run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: COHERE_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false

  # ── Frontend Web App (Vite React SPA) ──────────────────────────────────────
  - type: web
    name: cognora-web
    runtime: static
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter web run build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cognora-api
          property: host
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_COHERE_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
